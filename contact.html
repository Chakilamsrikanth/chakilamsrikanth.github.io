<script>
const CONTACT_ENDPOINT = 'https://formsubmit.co/ajax/srikanthchakilam25@gmail.com';
async function sendPortfolioMessage(values, fetcher = window.fetch) {
 const controller = new AbortController();
 const timer = setTimeout(() => controller.abort(), 25000);
 try {
  const response = await fetcher(CONTACT_ENDPOINT, {
   method: 'POST',
   headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
   signal: controller.signal,
   body: JSON.stringify({
    name: values.name.trim(), email: values.email.trim(),
    subject: values.subject.trim(), message: values.message.trim(),
    _subject: 'Portfolio message: ' + values.subject.trim().replace(/[\r\n]+/g, ' '),
    _replyto: values.email.trim(), _template: 'table', _captcha: 'false', _honey: ''
   })
  });
  const data = await response.json();
  if (!response.ok || !(data.success === true || data.success === 'true')) {
   throw new Error('The form service did not accept the message.');
  }
  return data;
 } finally { clearTimeout(timer); }
}
const contactForm = document.querySelector('#contact-form');
const successDialog = document.querySelector('#contact-success-dialog');
document.querySelector('#contact-success-close').addEventListener('click', () => successDialog.close());
contactForm.addEventListener('submit', async function(event) {
 event.preventDefault();
 if (!this.reportValidity() || this.getAttribute('aria-busy') === 'true') return;
 const values = Object.fromEntries(new FormData(this).entries());
 if (values._honey) return;
 const status = document.querySelector('#contact-form-status');
 const button = this.querySelector('button[type="submit"]');
 const originalLabel = button.textContent;
 this.setAttribute('aria-busy', 'true');
 button.disabled = true; button.textContent = 'Sending…';
 status.hidden = false; status.setAttribute('role', 'status');
 status.style.color = '#706b66'; status.textContent = 'Submitting your message…';
 try {
  await sendPortfolioMessage(values);
  this.reset();
  status.style.color = '#285c3d';
  status.textContent = 'Your message has been sent.';
  if (typeof successDialog.showModal === 'function') successDialog.showModal();
 } catch (error) {
  status.setAttribute('role', 'alert'); status.style.color = '#ac241c';
  status.replaceChildren();
  const text = document.createElement('span');
  text.textContent = 'Your message could not be submitted. Your text is still here—please try again or email ';
  const email = document.createElement('a');
  email.href = 'mailto:srikanthchakilam25@gmail.com';
  email.textContent = 'srikanthchakilam25@gmail.com';
  email.style.textDecoration = 'underline';
  status.append(text, email, document.createTextNode('.'));
 } finally {
  this.removeAttribute('aria-busy'); button.disabled = false; button.textContent = originalLabel;
 }
});
</script>
