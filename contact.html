.contact-classic .contact-section{width:min(1184px,calc(100% - 64px));margin:0 auto;padding:40px 0 64px;min-height:calc(100svh - 176px)}
.contact-classic .contact-heading{text-align:center;margin:0 0 48px}
.contact-classic .contact-heading h1{font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.6px;margin:0}
.contact-classic .contact-heading::after{content:'';display:block;width:56px;height:3px;margin:20px auto 0;background:#ac241c}
.contact-classic .contact-layout{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:64px;align-items:start}
.contact-classic .contact-detail{display:flex;align-items:flex-start;gap:16px;margin-bottom:32px}
.contact-classic .contact-detail-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:#f4e7e3;color:#ac241c}
.contact-classic .contact-detail-icon svg{width:20px;height:20px}
.contact-classic .contact-detail h2{font-size:20px;line-height:28px;font-weight:500;margin:0 0 6px}
.contact-classic .contact-detail a{font-size:14px;line-height:24px;color:#706b66;overflow-wrap:anywhere}
.contact-classic .contact-detail a:hover{color:#ac241c}
.contact-classic .contact-social-buttons{justify-content:flex-start;margin-top:8px}
.contact-classic .contact-form{display:grid;gap:20px}
.contact-classic .contact-form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.contact-classic .contact-field{display:grid;gap:6px;min-width:0}
.contact-classic .contact-field label{font-size:12px;line-height:20px;color:#706b66}
.contact-classic .contact-field input,.contact-classic .contact-field textarea{width:100%;border:1px solid #dcd7d1;border-radius:4px;background:#fff;color:#242321;font:inherit;font-size:14px;line-height:24px;padding:12px 14px}
.contact-classic .contact-field textarea{resize:vertical;min-height:160px}
.contact-classic .contact-field input:focus-visible,.contact-classic .contact-field textarea:focus-visible{outline:2px solid #ac241c;outline-offset:2px}
.contact-classic .contact-submit{text-align:center}
.contact-classic .contact-submit p{font-size:12px;line-height:20px;color:#797672;margin-top:10px}
.contact-classic .contact-form-status{font-size:13px;line-height:22px;color:#706b66}
@media(max-width:760px){.contact-classic .contact-section{width:calc(100% - 40px);padding:32px 0 48px}.contact-classic .contact-heading{margin-bottom:32px}.contact-classic .contact-layout{grid-template-columns:1fr;gap:40px}.contact-classic .contact-detail{margin-bottom:24px}.contact-classic .contact-heading h1{font-size:30px;line-height:38px}}
@media(max-width:440px){.contact-classic .contact-form-row{grid-template-columns:1fr}}

  <script>
function buildContactMailto(values){const subject=values.subject.trim().replace(/[\r\n]+/g,' ');const body='Name: '+values.name.trim()+'\nEmail: '+values.email.trim()+'\n\n'+values.message.trim();return 'mailto:srikanthchakilam25@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);}
document.querySelector('#contact-form').addEventListener('submit',function(event){event.preventDefault();if(!this.reportValidity())return;const values=Object.fromEntries(new FormData(this).entries());const status=document.querySelector('#contact-form-status');status.hidden=false;status.replaceChildren();const text=document.createElement('span');text.textContent='If your email app did not open, ';const retry=document.createElement('a');retry.href=buildContactMailto(values);retry.textContent='open the draft again';status.append(text,retry,document.createTextNode(' or use the email address on this page.'));window.location.href=retry.href;});
</script>
